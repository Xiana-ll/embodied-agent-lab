<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniMind 63.9M · 本地大模型 Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1117; color: #e6e8ee;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { font-size: 12px; color: #7d8598; }
  .bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: #171a23; border: 1px solid #242938; border-radius: 12px; padding: 10px 14px;
  }
  .bar label { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #4f8cff; width: 15px; height: 15px; cursor: pointer; }
  .hint { font-size: 12px; color: #6b7385; margin-left: auto; }
  #log {
    flex: 1; min-height: 420px; background: #171a23; border: 1px solid #242938;
    border-radius: 12px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .user .bubble { background: #2f6bd8; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #222633; border: 1px solid #2c3242; border-bottom-left-radius: 4px; }
  .bubble.err { background: #3a2024; border-color: #5c2a31; color: #ffb4b4; }
  .trace {
    margin: 2px 0 2px 8px; padding: 8px 12px; border-left: 2px solid #3b6fbf;
    background: #141823; border-radius: 0 8px 8px 0; font-size: 12.5px; color: #9fb0cf;
    font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
  }
  .trace .k { color: #6ea8ff; }
  form { display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; height: 52px; padding: 14px; border-radius: 10px;
    border: 1px solid #2c3242; background: #12151d; color: #e6e8ee; font-size: 14px;
    font-family: inherit; outline: none;
  }
  textarea:focus { border-color: #4f8cff; }
  button {
    padding: 0 22px; border: none; border-radius: 10px; background: #3b6fbf; color: #fff;
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #4f8cff; }
  button:disabled { background: #2c3242; cursor: not-allowed; color: #7d8598; }
  .dot { display: inline-block; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MiniMind 63.9M · 本地大模型</h1>
    <span class="sub">同一个后端，两种用法：直接聊天 / 工具调用</span>
  </header>

  <div class="bar">
    <label><input type="checkbox" id="useTools" /> 启用工具（Agent）</label>
    <span class="hint">勾选后模型可调用 计算器 / 时间</span>
  </div>

  <div id="log"></div>

  <form id="f">
    <textarea id="q" placeholder="试试：帮我算一下 256 乘以 37 等于多少" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('q');
const form = document.getElementById('f');
const send = document.getElementById('send');
const useTools = document.getElementById('useTools');

function add(cls, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + cls;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function addTrace(trace) {
  const el = document.createElement('div');
  el.className = 'trace';
  el.innerHTML = trace.map(t =>
    '<span class="k">' + t.tool + '</span>(' + JSON.stringify(t.args) + ')\n  → ' +
    JSON.stringify(t.result, null, 0)
  ).join('\n');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  add('user', text);
  input.value = '';
  send.disabled = true;

  const pending = add('bot', '思考中');
  pending.querySelector('.bubble').innerHTML = '思考中<span class="dot">…</span>';

  try {
    let data;
    if (useTools.checked) {
      const r = await fetch('/v1/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text })
      });
      data = await r.json();
      if (data.trace && data.trace.length) addTrace(data.trace);
      pending.querySelector('.bubble').textContent = data.answer || '(空)';
    } else {
      const r = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: text }], temperature: 0.7, max_tokens: 256 })
      });
      data = await r.json();
      pending.querySelector('.bubble').textContent = data.choices[0].message.content || '(空)';
    }
  } catch (err) {
    const b = pending.querySelector('.bubble');
    b.className = 'bubble err';
    b.textContent = '请求失败：' + err.message;
  } finally {
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }
});

// 回车发送（Shift+回车换行）
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
